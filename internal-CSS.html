<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal css</title>
    <!-- this is where you can write your css code in the head section of the html file. -->
    <style>
        p {
            color: red;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <p>This paragraph is red and bigger.</p>
    <p>So is this one — automatically.</p>
</body>
</html>
